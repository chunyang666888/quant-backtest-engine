[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-backtest-engine"
version = "0.1.0"
description = "Lightweight event-driven backtesting engine for quantitative trading strategies"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["backtest"]
